<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get in Touch — Lakshmi Anoop</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=3" />

  <style>
    /* Bio page custom styles */
    :root {
      --bio-bg: #f4f3ef;
      --bio-card-bg: #ffffff;
      --bio-btn-bg: #eeede9;
      --bio-btn-hover-bg: #e5e4e0;
      --bio-btn-border: #d9d8d3;
      --bio-text: #18181b;
      --bio-text-muted: #71717a;
      
      --silhouette-1: #e2e2dd;
      --silhouette-2: #eeeeea;
      --silhouette-3: #f4f3ef;
    }

    [data-theme="dark"] {
      --bio-bg: #0d0d0d;
      --bio-card-bg: #141414;
      --bio-btn-bg: #1a1a1a;
      --bio-btn-hover-bg: #252525;
      --bio-btn-border: #2a2a2a;
      --bio-text: #ffffff;
      --bio-text-muted: #8e8e93;

      --silhouette-1: #111111;
      --silhouette-2: #131313;
      --silhouette-3: #0d0d0d;
    }

    body {
      background: var(--bio-bg);
      color: var(--bio-text);
      transition: background var(--transition), color var(--transition);
    }

    .contact-page-wrapper {
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 120px 24px 80px 24px;
      position: relative;
      overflow-y: auto;
      z-index: 2;
    }

    /* SILHOUETTE BACKGROUND */
    .background-silhouette {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 250px;
      z-index: 1;
      pointer-events: none;
      display: flex;
      align-items: flex-end;
    }
    .background-silhouette svg {
      width: 100%;
      height: 100%;
    }

    /* Content container */
    .bio-container {
      position: relative;
      z-index: 5;
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* PROFILE SECTION */
    .profile-avatar-wrap {
      position: relative;
      width: 96px;
      height: 96px;
      margin-bottom: 16px;
      opacity: 0;
      transform: scale(0.8);
      animation: avatarFadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .profile-avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent);
      padding: 3px;
      background: var(--bio-bg);
      transition: transform 0.3s ease;
    }
    .profile-avatar:hover {
      transform: scale(1.05);
    }
    .active-dot {
      position: absolute;
      bottom: 6px;
      right: 6px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #2ed573;
      border: 2px solid var(--bio-bg);
      box-shadow: 0 0 8px #2ed573;
    }

    .profile-name {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 700;
      color: var(--bio-text);
      margin-bottom: 6px;
      opacity: 0;
      transform: translateY(15px);
      animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.1s;
    }

    .profile-tagline {
      font-family: var(--font-body); /* monospace font */
      font-size: 13.5px;
      color: var(--bio-text-muted);
      margin-bottom: 24px;
      opacity: 0;
      transform: translateY(15px);
      animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.2s;
    }

    /* ICON ROW */
    .icon-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 32px;
    }
    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--bio-btn-bg);
      border: 1px solid var(--bio-btn-border);
      color: var(--bio-text);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      opacity: 0;
      transform: scale(0);
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    .icon-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
    /* Hover effect */
    .icon-btn:hover {
      transform: scale(1.05);
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }

    
    .ambient-gradient {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 30%, rgba(127, 255, 178, 0.05), transparent 60%);
      animation: ambientPulse 8s infinite alternate ease-in-out;
      z-index: 1;
      pointer-events: none;
    }
    [data-theme="light"] .ambient-gradient {
      background: radial-gradient(circle at 50% 30%, rgba(26, 122, 60, 0.05), transparent 60%);
    }
    @keyframes ambientPulse {
      0% { transform: scale(1); opacity: 0.5; }
      100% { transform: scale(1.1); opacity: 1; }
    }

    .profile-avatar-wrap::before {
      content: '';
      position: absolute;
      top: -3px; left: -3px; right: -3px; bottom: -3px;
      border-radius: 50%;
      background: conic-gradient(var(--accent), #1abc9c, var(--accent));
      animation: spinBorder 4s linear infinite;
      z-index: -1;
    }
    @keyframes spinBorder {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .profile-avatar {
      border: 3px solid var(--bio-bg) !important;
      padding: 0 !important;
    }



    .pill-btn {
      position: relative;
      overflow: hidden;
    }
    .pill-btn::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 50%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
      animation: shimmerLoop 3s infinite;
    }
    @keyframes shimmerLoop {
      0% { left: -100%; }
      40% { left: 200%; }
      100% { left: 200%; }
    }
    [data-theme="light"] .pill-btn::after {
      background: linear-gradient(90deg, transparent, rgba(0,0,0,0.03), transparent);
    }

    .glow-divider {
      width: 100%;
      height: 1px;
      border: none;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      margin: 0 0 32px 0;
      opacity: 0.5;
    }

    /* CATEGORY LABEL */
    .category-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: var(--bio-text-muted);
      text-transform: uppercase;
      margin-bottom: 20px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .category-label::before,
    .category-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--bio-btn-border);
      max-width: 40px;
    }

    /* PILL GRID */
    .pill-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      width: 100%;
      margin-bottom: 50px;
    }
    .pill-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 56px;
      border-radius: 50px;
      background: var(--bio-btn-bg);
      border: 1px solid var(--bio-btn-border);
      color: var(--bio-text);
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 14.5px;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      opacity: 0;
      transform: translateY(20px);
      animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .pill-btn:hover {
      background: var(--bio-btn-hover-bg);
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.2);
      color: var(--bio-text);
      text-decoration: none;
    }
    [data-theme="light"] .pill-btn:hover {
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.05);
    }
    
    /* Grid span variations */
    .full-width-pill {
      grid-column: 1 / span 2;
    }
    
    /* CTA button variation */
    .cta-pill {
      background: var(--accent);
      color: #0b0c10 !important;
      border-color: var(--accent);
    }
    .cta-pill:hover {
      background: var(--accent) !important;
      filter: brightness(1.1);
      border-color: var(--accent);
      color: #0b0c10 !important;
      box-shadow: 0 10px 24px rgba(127, 255, 178, 0.3) !important;
    }
    [data-theme="light"] .cta-pill {
      background: var(--accent);
      color: #ffffff !important;
      border-color: var(--accent);
    }
    [data-theme="light"] .cta-pill:hover {
      color: #ffffff !important;
      box-shadow: 0 10px 24px rgba(26, 122, 60, 0.3) !important;
    }

    /* CONTACT FORM */
    .contact-form-section {
      width: 100%;
      max-width: 600px;
      background: var(--bio-card-bg);
      border: 1px solid var(--bio-btn-border);
      border-radius: 28px;
      padding: 36px;
      text-align: left;
      margin-bottom: 40px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.15);
      transition: background var(--transition), border-color var(--transition);
    }
    [data-theme="light"] .contact-form-section {
      box-shadow: 0 20px 50px rgba(0,0,0,0.03);
    }
    .form-header-title {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--bio-text);
    }
    .form-header-subtitle {
      font-size: 13px;
      color: var(--bio-text-muted);
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--bio-text-muted);
      margin-bottom: 8px;
      font-weight: 600;
    }
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      background: var(--bio-btn-bg);
      border: 1px solid var(--bio-btn-border);
      border-radius: 12px;
      padding: 14px 18px;
      font-family: var(--font-body);
      font-size: 13.5px;
      color: var(--bio-text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background var(--transition), color var(--transition);
      resize: vertical;
    }
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(127, 255, 178, 0.15);
    }
    [data-theme="light"] .form-group input:focus,
    [data-theme="light"] .form-group textarea:focus,
    [data-theme="light"] .form-group select:focus {
      box-shadow: 0 0 0 3px rgba(26, 122, 60, 0.15);
    }
    .form-group textarea {
      min-height: 120px;
    }

    .btn-submit {
      width: 100%;
      height: 56px;
      border-radius: 50px;
      background: var(--accent);
      color: #0b0c10;
      border: none;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 14.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-submit:hover {
      filter: brightness(1.1);
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(127, 255, 178, 0.3);
    }
    [data-theme="light"] .btn-submit {
      color: #ffffff;
    }
    [data-theme="light"] .btn-submit:hover {
      box-shadow: 0 10px 24px rgba(26, 122, 60, 0.3);
    }

    #form-status {
      margin-top: 16px;
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      display: none;
    }
    #form-status.success {
      background: rgba(46, 213, 115, 0.1);
      border: 1px solid #2ed573;
      color: #2ed573;
      display: block;
    }
    #form-status.error {
      background: rgba(255, 71, 87, 0.1);
      border: 1px solid #ff4757;
      color: #ff4757;
      display: block;
    }
    
    /* Nav bar styling overrides for spacing */
    .contact-page-nav {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 32px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .back-home-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text);
      font-size: 13.5px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s ease;
      font-family: var(--font-display);
    }

    .back-home-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateX(-4px);
      text-decoration: none;
    }

    .back-home-btn svg {
      width: 16px;
      height: 16px;
      transition: transform 0.3s ease;
    }

    .back-home-btn:hover svg {
      transform: translateX(-2px);
    }

    /* ENTRANCE ANIMATIONS */
    @keyframes avatarFadeIn {
      0% {
        opacity: 0;
        transform: scale(0.8);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }
    @keyframes fadeUp {
      0% {
        opacity: 0;
        transform: translateY(15px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(0);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }
    @keyframes slideUp {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Responsive adjustments */
    @media (max-width: 500px) {
      .pill-grid {
        grid-template-columns: 1fr;
      }
      .full-width-pill {
        grid-column: span 1;
      }
      .contact-form-section {
        padding: 24px;
      }
      .contact-page-nav {
        padding: 20px 16px;
      }
    }

    /* Asymmetric, Editorial Redesign Overrides */
    .bio-container {
      align-items: flex-start !important;
      text-align: left !important;
      max-width: 650px !important;
      padding-left: 5% !important;
      position: relative !important;
    }
    
    .profile-avatar-wrap {
      margin-left: 5% !important;
      align-self: flex-start !important;
    }
    
    .profile-name {
      margin-left: 5% !important;
      text-align: left !important;
      align-self: flex-start !important;
      font-weight: 800 !important;
      letter-spacing: -0.02em !important;
    }
    
    .profile-tagline {
      margin-left: 5% !important;
      text-align: left !important;
      align-self: flex-start !important;
      font-weight: 300 !important;
      letter-spacing: 0.04em !important;
    }

    .icon-row {
      margin-left: 5% !important;
      align-self: flex-start !important;
      justify-content: flex-start !important;
      gap: 16px !important;
    }

    .category-label {
      justify-content: flex-start !important;
      margin-left: 5% !important;
      width: auto !important;
    }
    .category-label::before {
      display: none !important;
    }

    /* Pill buttons: stay full width but uneven padding (more left padding) */
    .pill-btn {
      padding-left: 36px !important;
      padding-right: 18px !important;
      justify-content: flex-start !important;
    }

    /* Alternating border radius on pill buttons */
    .pill-btn:nth-child(odd) {
      border-radius: 50px !important;
    }
    .pill-btn:nth-child(even) {
      border-radius: 8px !important;
    }

    /* Hello/Let's Talk watermark behind content */
    .contact-page-wrapper::before {
      content: "HELLO" !important;
      position: fixed !important;
      bottom: 2% !important;
      right: 2% !important;
      font-size: 18vw !important;
      font-family: var(--font-display) !important;
      font-weight: 900 !important;
      color: #ffffff !important;
      opacity: 0.025 !important;
      z-index: 0 !important;
      pointer-events: none !important;
      letter-spacing: -0.05em !important;
      white-space: nowrap !important;
      line-height: 0.8 !important;
    }



    /* Irregular container circle sizing for icon buttons */
    .icon-btn:nth-child(5n+1) { width: 38px !important; height: 38px !important; }
    .icon-btn:nth-child(5n+2) { width: 44px !important; height: 44px !important; }
    .icon-btn:nth-child(5n+3) { width: 40px !important; height: 40px !important; }
    .icon-btn:nth-child(5n+4) { width: 46px !important; height: 46px !important; }
    .icon-btn:nth-child(5n)   { width: 42px !important; height: 42px !important; }
  </style>
</head>

  <script>
    // Theme Management Sync
    const html = document.documentElement;
    const themeBtn = document.getElementById('themeBtn');
    const themeIcon = document.getElementById('themeIcon');
    const themeLabel = document.getElementById('themeLabel');

    function applyTheme(theme) {
      html.setAttribute('data-theme', theme);
      if (theme === 'dark') {
        themeIcon.textContent  = '☀️';
        themeLabel.textContent = 'Light';
      } else {
        themeIcon.textContent  = '🌙';
        themeLabel.textContent = 'Dark';
      }
      localStorage.setItem('portfolio-theme', theme);
    }

    const savedTheme = localStorage.getItem('portfolio-theme') || 'dark';
    applyTheme(savedTheme);

    themeBtn.addEventListener('click', () => {
      const current = html.getAttribute('data-theme');
      applyTheme(current === 'dark' ? 'light' : 'dark');
    });

    // Simulated Resume Download feedback
    const resumeBtn = document.getElementById('hub-resume-btn');
    if (resumeBtn) {
      resumeBtn.addEventListener('click', (e) => {
        e.preventDefault();
        const originalText = resumeBtn.textContent.trim();
        
        resumeBtn.textContent = '⚡ File download started...';
        
        setTimeout(() => {
          resumeBtn.textContent = originalText;
          alert('Resume download started! (Simulated PDF download)');
        }, 1000);
      });
    }

    // Form Submission Database Sync
    const LS_KEY = 'portfolio_contact_responses';

    function getResponses() {
      try {
        return JSON.parse(localStorage.getItem(LS_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveResponses(arr) {
      localStorage.setItem(LS_KEY, JSON.stringify(arr));
    }

    const submitBtn  = document.getElementById('submit-contact');
    const formStatus = document.getElementById('form-status');

    if (submitBtn) {
      submitBtn.addEventListener('click', () => {
        const name    = document.getElementById('cf-name').value.trim();
        const email   = document.getElementById('cf-email').value.trim();
        const subject = document.getElementById('cf-subject').value;
        const message = document.getElementById('cf-message').value.trim();

        if (!name || !email || !subject || !message) {
          formStatus.className   = 'error';
          formStatus.textContent = '⚠ Please fill in all fields before submitting.';
          return;
        }

        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          formStatus.className   = 'error';
          formStatus.textContent = '⚠ Please enter a valid email address.';
          return;
        }

        const entry = {
          id:        Date.now(),
          name,
          email,
          subject,
          message,
          timestamp: new Date().toISOString()
        };

        const responses = getResponses();
        responses.unshift(entry);
        saveResponses(responses);

        // Reset fields
        document.getElementById('cf-name').value    = '';
        document.getElementById('cf-email').value   = '';
        document.getElementById('cf-subject').value = '';
        document.getElementById('cf-message').value = '';

        formStatus.className   = 'success';
        formStatus.textContent = '✓ Message sent! I\'ll get back to you soon.';

        setTimeout(() => {
          formStatus.className   = '';
          formStatus.textContent = '';
        }, 4000);
      });
    }
  </script>
