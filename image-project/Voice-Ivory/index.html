<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice Ivory — AI-Powered Voice Productivity App</title>
    <meta name="description" content="Voice Ivory is a premium, AI-powered voice productivity application. Speak, think, and do with natural voice interactions, auto-transcriptions, smart summarizers, and automated email generation." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="error-log" style="color: #ff3333; font-family: monospace; font-size: 14px; padding: 20px; white-space: pre-wrap; z-index: 99999; position: relative; background: #000; border: 1px solid red; margin: 10px;"></div>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        const div = document.getElementById('error-log');
        if (div) {
          div.innerHTML += 'Error: ' + message + '\\nSource: ' + source + '\\nLine: ' + lineno + ' Col: ' + colno + '\\nStack: ' + (error ? error.stack : '') + '\\n\\n';
        }
        return false;
      };
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
