<!-- ==========================================================================
     CERTIFICATE LIGHTBOX & DETAILS MODAL
     High-resolution image zoom modal and detailed recognition slide-over panel.
     ========================================================================== -->
<!-- Lightbox Overlay -->
  <div id="cert-lightbox" class="cert-lightbox">
    <div class="lightbox-content">
      <img loading="lazy" id="lightbox-img" src="" alt="Certificate View">
    </div>
  </div>

  <!-- Details Panel -->
  <div id="cert-details-panel" class="cert-details-panel">
    <button class="panel-close-btn" aria-label="Close details">&times;</button>
    <div class="panel-inner">
      <div class="panel-thumb-container">
        <img loading="lazy" id="panel-cert-img" src="" alt="Certificate Detail View">
      </div>
      <div class="panel-metadata">
        <span id="panel-category" class="panel-tag">Category</span>
        <h3 id="panel-title" class="panel-title">Certificate Title</h3>

        <div class="panel-detail-row">
          <span class="detail-label">Issued By</span>
          <span id="panel-issuer" class="detail-value">Organization</span>
        </div>
        <div class="panel-detail-row">
          <span class="detail-label">Year</span>
          <span id="panel-year" class="detail-value">2025</span>
        </div>

        <div class="panel-description-section">
          <h4 class="desc-heading">About this Recognition</h4>
          <p id="panel-description" class="panel-description">A short one-line description about this certificate.</p>
        </div>
      </div>
    </div>
  </div>
